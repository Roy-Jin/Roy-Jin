<!-- https://github.com/Wxh16144/glitch-art -->
<svg 
  xmlns='http://www.w3.org/2000/svg'
  xmlns:xlink='http://www.w3.org/1999/xlink'
  viewBox='0 0 370 30'
  style='background-color: transparent'
  width='370px'
  height='30px'
>
  <style>
    @font-face {
  font-family: 'Doto';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}

    .text-1,
    .text-2 {
      font-family: Doto, monospace;
      font-size: 30px;
    }
    .text-1 {
      fill: red;
    }
    .text-2 {
      fill: cyan;
      mix-blend-mode: darken;
    }
    @media (prefers-color-scheme: dark) {
      .text-2 { mix-blend-mode: lighten; }
    }
  </style>

  <!-- text 1 -->
  <text
    y="50%"
    dominant-baseline="middle"
    x="50%"
    text-anchor="middle"
  >
    <tspan class="text-1">Hello, I&#39;m Roy-Jin.</tspan>
    <animateTransform
      values="-0.0,0.9; -0.8,-0.7; 0.4,-0.6; -0.6,-0.5; -0.1,0.7; -1.0,1.0; 1.0,-0.5; 0.9,-0.7; -0.0,0.9"
      attributeName="transform"
      dur="1s"
      repeatCount="indefinite"
    />
  </text>

  <!-- text 2 -->
  <text
    y="50%"
    dominant-baseline="middle"
    x="50%"
    text-anchor="middle"
  >
    <tspan class="text-2">Hello, I&#39;m Roy-Jin.</tspan>
    <animateTransform
      values="-0.0,0.9; -0.8,-0.7; 0.4,-0.6; -0.6,-0.5; -0.1,0.7; -1.0,1.0; 1.0,-0.5; 0.9,-0.7; -0.0,0.9"
      attributeName="transform"
      dur="1s"
      begin="0.18s"
      repeatCount="indefinite"
    />
  </text>
</svg>